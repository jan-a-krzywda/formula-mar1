# Build Sphinx HTML API docs and deploy to gh-pages.
#
# After first successful run:
#   Repo → Settings → Pages → Source: Deploy from a branch
#   Branch: gh-pages / / (root)
#
# Site URL: https://jan-a-krzywda.github.io/formula-mar1/

name: Deploy documentation

on:
  push:
    branches: [main, master]
    paths:
      - "sphinx/**"
      - ".github/workflows/docs.yml"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sphinx/requirements.txt

      - name: Install Sphinx
        run: pip install -r sphinx/requirements.txt

      - name: Build HTML
        run: |
          sphinx-build -b html sphinx/source "$GITHUB_WORKSPACE/_site"
          touch "$GITHUB_WORKSPACE/_site/.nojekyll"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          force_orphan: true
