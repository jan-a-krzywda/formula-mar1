# Formula Mar1 — Documentation Theme for Jekyll (Tom Johnson / v6.0 lineage)
# Local: cd jekyll && bundle install && bundle exec jekyll serve
# GitHub Pages (project site): defaults are jan-a-krzywda/formula-mar1; change for a fork.

repository: jan-a-krzywda/formula-mar1

output: web

topnav_title: Formula Mar1

site_title: Formula Mar1 documentation

company_name: Formula Mar1

github_editme_path: jan-a-krzywda/formula-mar1/blob/main/jekyll/

google_analytics:

host: 127.0.0.1

port: 4000

exclude:
  - .idea/
  - .gitignore
  - vendor
  - README.md
  - pdf/
  - pdfconfigs/
  - pdf-all.sh
  - pdf-mydoc.sh
  - pdf-product1.sh
  - pdf-product2.sh
  - Dockerfile
  - docker-compose.yml
  - .gitlab-ci.yml
  - createtag
  - update.sh

feedback_subject_line: Formula Mar1 documentation

feedback_email:

feedback_disable: true

highlighter: rouge

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

collections:
  tooltips:
    output: false

defaults:
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      comments: false
      search: true
      sidebar: home_sidebar
      topnav: topnav
  -
    scope:
      path: ""
      type: "tooltips"
    values:
      layout: "page"
      search: true
      tooltip: true

  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      search: true
      sidebar: home_sidebar
      topnav: topnav

sidebars:
- home_sidebar
- mydoc_sidebar
- product1_sidebar
- product2_sidebar
- other

description: "Formula Mar1 — F1-style race strategy simulation and reinforcement learning (JAX / Flax / PPO)."

# GitHub Project Pages: https://jan-a-krzywda.github.io/formula-mar1/
url: "https://jan-a-krzywda.github.io"
baseurl: "/formula-mar1"

github: [metadata]
